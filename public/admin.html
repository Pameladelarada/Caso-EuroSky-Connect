<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro administrativo | EuroSky Connect</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="topbar">
        <a class="brand" href="index.html" aria-label="EuroSky Connect">
            <span class="brand-mark">ES</span>
            <span>
                <strong>EuroSky Connect</strong>
                <small>Administracion de datos JSON</small>
            </span>
        </a>
        <nav class="nav-links" aria-label="Navegacion administrativa">
            <a href="index.html">Inicio</a>
            <button id="logoutButton" class="nav-button" type="button">Salir</button>
        </nav>
    </header>

    <main class="admin-page">
        <section class="admin-hero">
            <div class="section-title wide">
                <p>RF01 y RF04</p>
                <h1>Registro de aeropuertos europeos y aeronaves disponibles</h1>
            </div>
            <div class="admin-summary" aria-label="Resumen administrativo">
                <div><strong id="adminAirports">0</strong><span>Aeropuertos</span></div>
                <div><strong id="adminRoutes">0</strong><span>Rutas</span></div>
                <div><strong id="adminAircraft">0</strong><span>Aeronaves</span></div>
            </div>
        </section>

        <section class="admin-panel">
            <div class="panel">
                <div class="section-title">
                    <p>RF01</p>
                    <h2>Registrar aeropuerto europeo</h2>
                </div>
                <form id="airportForm" class="route-form">
                    <label for="airportName">Nombre del aeropuerto</label>
                    <input type="text" id="airportName" required>

                    <label for="airportCode">Codigo IATA</label>
                    <input type="text" id="airportCode" maxlength="3" required>

                    <label for="airportCountry">Pais</label>
                    <input type="text" id="airportCountry" required>

                    <label for="airportCity">Ciudad</label>
                    <input type="text" id="airportCity" required>

                    <label for="airportLat">Latitud</label>
                    <input type="number" id="airportLat" step="0.0001" required>

                    <label for="airportLng">Longitud</label>
                    <input type="number" id="airportLng" step="0.0001" required>

                    <label for="airportAttraction">Referencia turistica</label>
                    <input type="text" id="airportAttraction" placeholder="Atractivo principal del destino">

                    <button type="submit">Guardar aeropuerto</button>
                </form>
                <p id="airportMessage" class="form-message"></p>
            </div>

            <div class="panel">
                <div class="section-title">
                    <p>RF04</p>
                    <h2>Registrar aeronave rentada</h2>
                </div>
                <form id="aircraftForm" class="route-form">
                    <label for="aircraftName">Nombre de aeronave</label>
                    <input type="text" id="aircraftName" required>

                    <label for="aircraftCapacity">Capacidad maxima</label>
                    <input type="number" id="aircraftCapacity" min="1" max="255" required>

                    <label for="aircraftCost">Costo diario de alquiler</label>
                    <input type="number" id="aircraftCost" min="0" step="0.01" required>

                    <label for="aircraftRange">Autonomia estimada (km)</label>
                    <input type="number" id="aircraftRange" min="0" step="0.01" required>

                    <label for="aircraftRestrictions">Restricciones operativas</label>
                    <input type="text" id="aircraftRestrictions" required>

                    <button type="submit">Guardar aeronave</button>
                </form>
                <p id="aircraftMessage" class="form-message"></p>
            </div>
        </section>
    </main>

    <script src="admin.js"></script>
</body>
</html>
