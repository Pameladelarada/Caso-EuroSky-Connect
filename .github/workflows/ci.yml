name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Si se empuja dos veces seguidas a la misma rama, cancela la corrida vieja.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  motor-cpp:
    timeout-minutes: 15
    name: Engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Compiler version
        run: g++ --version

      - name: Build the engine
        run: make

      - name: Run the engine tests
        run: make test

      # timeout viene de GNU coreutils y no esta en macOS por defecto.
      - name: Regression - an unknown airport ID must not crash the program
        if: runner.os == 'Linux'
        run: |
          codigo=0
          printf "7\n999\n999\n9\n" | timeout 10 ./build/eurosky > salida.txt 2>&1 || codigo=$?

          if [ "$codigo" -eq 124 ]; then
            echo "FAILED: the program hung instead of reporting the bad ID"
            exit 1
          fi

          grep -q "ID no valido" salida.txt
          echo "OK: the program reports the bad ID and continues instead of throwing"

      # timeout viene de GNU coreutils y no esta en macOS por defecto.
      - name: Regression - closed stdin must not cause an infinite loop
        if: runner.os == 'Linux'
        run: |
          codigo=0
          printf "abc\n" | timeout 10 ./build/eurosky > bucle.txt 2>&1 || codigo=$?

          if [ "$codigo" -eq 124 ]; then
            echo "FAILED: the program never terminated"
            exit 1
          fi

          lineas=$(wc -l < bucle.txt)
          echo "Lines produced: $lineas"
          test "$lineas" -lt 100
          echo "OK: the program terminates instead of reprinting the menu forever"

  api-node:
    timeout-minutes: 15
    name: API (Node v${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run the API tests
        run: npm test

      - name: Check data.json was left untouched
        run: git diff --exit-code data.json
